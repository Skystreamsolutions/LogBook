# Pre-commit hooky (D1, karta t_8dd15d90). Rýchle kontroly pred každým commitom.
# Inštalácia raz na klon:  uv tool install pre-commit && pre-commit install
# Ručne spustiť hooky:     pre-commit run --all-files
#   --all-files odovzdá hookom sledované súbory, ale každý hook má vlastný
#   rozsah (pripnuté verzie, argumenty nižšie):
#   - detect-private-key: všetky sledované súbory.
#   - check-added-large-files: len súbory novo pridané v indexe
#     (bez --enforce-all).
#   - check-merge-conflict: kontroluje len počas prebiehajúceho merge
#     (bez --assume-in-merge).
#   - gitleaks: beží ako `gitleaks git --pre-commit --staged` s
#     pass_filenames: false, teda len zmeny pripravené v indexe (staged).
#     Už commitnuté tajomstvá nepreverí a pri prázdnom indexe nič.
# RUČNÁ KONTROLA TAJOMSTIEV (mimo pre-commit, z koreňa repozitára):
#   gitleaks git --redact      celá git história (všetky commity)
#   gitleaks dir --redact .    aktuálne súbory na disku (aj necommitnuté)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
