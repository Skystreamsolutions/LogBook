# Minimálne CI (D1, karta t_8dd15d90): typecheck, lint, testy, build, gitleaks.
# Nepotrebuje žiadne produkčné tajomstvá a nič nenasadzuje.
name: CI

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Prisma generate
        run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      # Lint má v main existujúce chyby (technický dlh). Beží a hlási sa,
      # ale zatiaľ neblokuje; po ich oprave odstráň continue-on-error.
      - name: Lint (neblokujúci – známy dlh)
        continue-on-error: true
        run: npm run lint
      # Testy: repozitár zatiaľ nemá žiadne testy ani test skript.
      - name: Build
        run: npm run build

  secrets:
    name: gitleaks (celá história)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (overený sha256)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
